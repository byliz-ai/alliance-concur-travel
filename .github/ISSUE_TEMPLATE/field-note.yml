name: Field note
description: Something the skill should learn from a real use of Concur (anonymous)
title: "[Field note] "
labels: ["field-note"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the skill learn. **Issues here are public**: don't include names, emails, card digits, report or TR IDs, budget codes, or amounts linked to a person.
        If Claude drafted a field note for you at the end of a session, you can paste it in "What happened" and leave the rest as is.
  - type: input
    id: version
    attributes:
      label: Skill version
      description: Shown in SKILL.md (metadata.version) or in the release you downloaded.
      placeholder: "1.3"
  - type: input
    id: hub
    attributes:
      label: Hub / Accounting Office
      placeholder: "e.g. Nairobi / NBO"
  - type: dropdown
    id: entity
    attributes:
      label: Entity
      options:
        - CIAT
        - Bioversity
        - Not sure
  - type: dropdown
    id: interface
    attributes:
      label: Concur interface language
      options:
        - US English (Expense Report)
        - UK English (Expense Claim)
        - Not sure
  - type: dropdown
    id: mode
    attributes:
      label: What were you doing?
      options:
        - Travel request
        - Expense report
        - Report sent back by the processor
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Concur's exact wording (field, menu, alert, error) or the processor's comment.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the skill expected
      description: The step or reference that didn't match, if any.
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: What to add or fix, and whether it applies to everyone, a hub or an entity.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This note contains no personal data.
          required: true
